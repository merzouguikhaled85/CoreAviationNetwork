            <path d="M68,10 L136,230 L116,230 L104,190 L32,190 L20,230 L0,230 Z"
                  fill="url(#bevel)" opacity="0.65"/>
          </g>
          <g transform="translate(376,0)">
            <path d="M0,230 L0,10 L24,10 L160,196 L160,10 L184,10 L184,230 L160,230 L24,44 L24,230 Z"
                  fill="url(#paint)" stroke="url(#edge)" stroke-width="2"/>
            <path d="M0,10 L24,10 L160,196 L160,10 L184,10 L184,230 L160,230 L24,44 L24,230 L0,230 Z"
                  fill="url(#bevel)" opacity="0.5"/>
          </g>
        </g>
      </g>
      <g transform="translate(160,258)">
        <text x="0" y="0" font-family="Poppins, Segoe UI, Roboto, Arial, sans-serif"
              font-size="28" fill="#FFFFFF" opacity="0.98" letter-spacing="0.6">
          Core Aviation Network
        </text>
        <text x="0" y="0" font-family="Poppins, Segoe UI, Roboto, Arial, sans-serif"
              font-size="28" fill="#FFD34D" opacity="0.28">
          Core Aviation Network
        </text>
      </g>
      <g transform="translate(150,304) scale(1,-0.8)" mask="url(#mirror-mask)" opacity="0.55">
        <path d="M0,120 C0,58 48,10 114,10 C140,10 162,16 186,28 L176,44 C160,36 142,30 116,30 C64,30 36,64 36,120 C36,174 66,208 116,208 C142,208 160,202 176,194 L186,210 C162,224 140,230 114,230 C48,230 0,182 0,120 Z"
              fill="url(#paint)" opacity="0.18"/>
        <g transform="translate(210,0)">
          <path d="M0,230 L68,10 L136,230 L116,230 L104,190 L32,190 L20,230 Z" fill="url(#paint)" opacity="0.16"/>
        </g>
        <g transform="translate(376,0)">
          <path d="M0,230 L0,10 L24,10 L160,196 L160,10 L184,10 L184,230 L160,230 L24,44 L24,230 Z"
                fill="url(#paint)" opacity="0.16"/>
        </g>
      </g>
    </g>
  </g>
</svg>