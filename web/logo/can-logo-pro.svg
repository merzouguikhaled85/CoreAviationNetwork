      </g>
      <g transform="translate(150,0) skewX(-6) rotate(-4 0 0)">
        <g filter="url(#shadow)">
          <path d="M0,120 C0,58 48,10 114,10 C140,10 162,16 186,28 L176,44 C160,36 142,30 116,30 C64,30 36,64 36,120 C36,174 66,208 116,208 C142,208 160,202 176,194 L186,210 C162,224 140,230 114,230 C48,230 0,182 0,120 Z"
