          <path d="M36,120 C36,64 63,30 116,30 C142,30 160,36 176,44 L186,28
                   C162,16 140,10 114,10 C48,10 0,58 0,120 C0,182 48,230 114,230
                   C140,230 162,224 186,210 L176,194 C160,202 142,208 116,208
                   C66,208 36,174 36,120 Z" fill="url(#bevel)"/>
          <g transform="translate(210,0)">
            <path d="M0,230 L68,10 L136,230 L116,230 L104,190 L32,190 L20,230 Z
